server:
  port: 8090
  address: 0.0.0.0

# database configuration
spring:
  datasource:
    username: postgres
    password: postgres
    url: jdbc:postgresql://localhost:5432/tms_db
  servlet:
    multipart:
      enabled: true
      max-file-size: 30MB
      max-request-size: 200MB
  # Mongo DB configuration
  data:
    mongodb:
      uri: mongodb://root:root@localhost:27017/easy-chat?authSource=admin
      username: root
      password: root

  jpa:
    show-sql: true
    open-in-view: true
    hibernate:
      ddl-auto: update

  flyway:
    baseline-on-migrate: true
  # thymeleaf for development purpose
  thymeleaf:
    cache: false
#    prefix: classpath:/templates/
    prefix: file:src/main/resources/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    servlet:
      content-type: text/html

# logging
logging:
  level:
    org.springframework.web: debug
    org.springframework.security: debug
    com.tms.easyrento.dbMappers: debug

    # MongoDB
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate.query: TRACE
    org.mongodb.driver: DEBUG


# jwt property
jwt:
  secret-key: X7BSnMS4e12M0Sz/4IWr+VPNK6vpAee5LfhaM3scjiU=
  token-expiration-in-minutes: 1

# identify mybatis mapper
mybatis:
  mapper-locations: classpath*:**/mappers/*Mapper.xml
  type-aliases-package: classpath*:**/java/com/tms/easyrento/dto/**
